name: Daily Maintenance Check & Alert

on:
  schedule:
    - cron: '30 3 * * *' # 09:00 AM IST daily
  workflow_dispatch:

jobs:
  check-and-alert:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check Due Dates & Dispatch Alert
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const fileContent = JSON.parse(fs.readFileSync('data.json', 'utf8'));
            const schedules = Array.isArray(fileContent) ? fileContent : (fileContent.schedules || []);

            const targetDate = new Date();
            targetDate.setDate(targetDate.getDate() + 7);
            const targetStr = targetDate.toISOString().split('T')[0];

            const dueItems = schedules.filter(item => item.next_due_date === targetStr);

            if (dueItems.length === 0) {
              console.log('No services due in 7 days.');
              return;
            }

            let body = `### 📌 Maintenance Due in 7 Days (${targetStr})\n\n`;
            body += `The following **${dueItems.length} unit(s)** require service coordination:\n\n`;

            dueItems.forEach((item, idx) => {
              body += `---\n\n`;
              body += `### ${idx + 1}. ${item.building_name} — Unit ${item.unit_number}\n\n`;
              body += `* **Service Required:** ${item.service_type}\n`;
              body += `* **Tenant Name:** ${item.tenant_name || 'N/A'}\n`;
              body += `* **Scheduled Due Date:** 🚨 **${item.next_due_date}**\n`;
              body += `* **Last Service Date:** ${item.last_service_date}\n\n`;
            });

            body += `---\n\n`;
            body += `👉 **[Open Maintenance Console](https://ekodio.github.io/apartment-service-reminders/)**\n`;

            // Omitting 'assignees' ensures GitHub only sends ONE email instead of two
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Maintenance Alert: ${dueItems.length} unit(s) due on ${targetStr}`,
              body: body
            });
