name: Daily Maintenance Check & Alert

on:
  schedule:
    - cron: '30 3 * * *' # Runs daily at 09:00 AM IST
  workflow_dispatch:

jobs:
  check-and-alert:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check Due Dates & Dispatch Alert
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('data.json', 'utf8'));

            // Target date: exactly 7 days from today
            const targetDate = new Date();
            targetDate.setDate(targetDate.getDate() + 7);
            const targetStr = targetDate.toISOString().split('T')[0];

            console.log(`Checking for maintenance due on: ${targetStr}`);

            const dueItems = data.filter(item => item.next_due_date === targetStr);

            if (dueItems.length === 0) {
              console.log('No service reminders due in 7 days.');
              return;
            }

            // Construct notification body
            let body = `## 🔔 Scheduled Maintenance Alert (Due in 7 Days)\n\n`;
            body += `Attention: @${context.repo.owner}\n\n`;
            body += `The following service(s) are due on **${targetStr}**:\n\n`;
            
            dueItems.forEach(item => {
              body += `### 🏢 ${item.building_name} — ${item.unit_number}\n`;
              body += `- **Tenant:** 👤 ${item.tenant_name || 'N/A'}\n`;
              body += `- **Service:** 🛠️ ${item.service_type}\n`;
              body += `- **First Done:** 📅 ${item.first_service_date || 'N/A'}\n`;
              body += `- **Last Done:** 📅 ${item.last_service_date}\n`;
              body += `- **Due Date:** 🚨 **${item.next_due_date}**\n\n`;
            });
            body += `> Please coordinate with vendors and tenants to confirm maintenance slots.`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⚠️ Maintenance Due in 7 Days: ${dueItems.length} Unit(s) on ${targetStr}`,
              body: body,
              assignees: [context.repo.owner]
            });

            console.log('Alert issue created and assigned.');
