name: Daily Maintenance Check & Alert

on:
  schedule:
    - cron: '30 3 * * *' # Runs daily at 09:00 AM IST
  workflow_dispatch:

jobs:
  check-and-alert:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check Due Dates & Dispatch Alert
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const fileContent = JSON.parse(fs.readFileSync('data.json', 'utf8'));
            const schedules = Array.isArray(fileContent) ? fileContent : (fileContent.schedules || []);

            const targetDate = new Date();
            targetDate.setDate(targetDate.getDate() + 7);
            const targetStr = targetDate.toISOString().split('T')[0];

            const dueItems = schedules.filter(item => item.next_due_date === targetStr);

            if (dueItems.length === 0) {
              console.log('No service reminders due in 7 days.');
              return;
            }

            let body = `### 📋 Maintenance Due in 7 Days (${targetStr})\n\n`;
            body += `| Property / Unit | Tenant | Service | Last Service | Target Due Date |\n`;
            body += `| :--- | :--- | :--- | :--- | :--- |\n`;

            dueItems.forEach(item => {
              body += `| **${item.building_name}** - ${item.unit_number} | ${item.tenant_name || 'N/A'} | ${item.service_type} | ${item.last_service_date} | 🚨 **${item.next_due_date}** |\n`;
            });

            body += `\n---\n`;
            body += `👉 **[Open Maintenance Console](https://ekodio.github.io/apartment-service-reminders/)** to coordinate vendors or mark jobs complete.\n`;
            body += `\n> *This is an automated 7-day lead alert.*`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Action Required] Maintenance Due in 7 Days: ${dueItems.length} Unit(s) on ${targetStr}`,
              body: body,
              assignees: [context.repo.owner]
            });
