name: Daily Maintenance Check & Alert

on:
  schedule:
    - cron: '30 3 * * *' # 09:00 AM IST daily
  workflow_dispatch:

jobs:
  check-and-alert:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Due Dates & Dispatch Alert
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const fileContent = JSON.parse(fs.readFileSync('data.json', 'utf8'));
            const schedules = Array.isArray(fileContent) ? fileContent : (fileContent.schedules || []);

            const targetDate = new Date();
            targetDate.setDate(targetDate.getDate() + 7);
            const targetStr = targetDate.toISOString().split('T')[0];

            const dueItems = schedules.filter(item => item.next_due_date === targetStr);

            if (dueItems.length === 0) {
              console.log('No services due in 7 days.');
              return;
            }

            // Clean, human-readable card format (renders properly on all mobile email apps)
            let body = `Maintenance is due in **7 days** (${targetStr}) for the following unit(s):\n\n`;

            dueItems.forEach((item, idx) => {
              body += `**${idx + 1}. ${item.building_name} — Unit ${item.unit_number}**\n`;
              body += `• Service: **${item.service_type}**\n`;
              body += `• Tenant: ${item.tenant_name || 'N/A'}\n`;
              body += `• Due Date: **${item.next_due_date}** (Last done: ${item.last_service_date})\n\n`;
            });

            body += `[Open Maintenance Console](https://ekodio.github.io/apartment-service-reminders/)\n`;

            // Single call with assignees included prevents the duplicate "Re:" email
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Maintenance Alert: ${dueItems.length} unit(s) due on ${targetStr}`,
              body: body,
              assignees: [context.repo.owner]
            });
