name: Daily Maintenance Check & Alert

on:
  schedule:
    - cron: '30 3 * * *' # 09:00 AM IST daily
  workflow_dispatch:

jobs:
  check-and-alert:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check Due Dates & Dispatch Alert
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const fileContent = JSON.parse(fs.readFileSync('data.json', 'utf8'));
            const schedules = Array.isArray(fileContent) ? fileContent : (fileContent.schedules || []);

            const targetDate = new Date();
            targetDate.setDate(targetDate.getDate() + 7);
            const targetStr = targetDate.toISOString().split('T')[0];

            const formatToDMY = (dStr) => {
              if (!dStr) return 'N/A';
              const parts = dStr.split('-');
              return parts.length === 3 ? `${parts[2]}-${parts[1]}-${parts[0]}` : dStr;
            };

            const targetDMY = formatToDMY(targetStr);
            const dueItems = schedules.filter(item => item.next_due_date === targetStr);

            if (dueItems.length === 0) {
              console.log('No services due in 7 days.');
              return;
            }

            let body = `Attention: @${context.repo.owner}\n\n`;
            body += `## Maintenance Due in 7 Days (${targetDMY})\n\n`;
            body += `**${dueItems.length} unit(s)** require service coordination.\n\n`;

            dueItems.forEach((item, idx) => {
              body += `### Property #${idx + 1}: ${item.building_name} — Unit ${item.unit_number}\n\n`;
              body += `<table width="100%" border="1" cellpadding="10" cellspacing="0">\n`;
              body += `  <tbody>\n`;
              body += `    <tr>\n`;
              body += `      <td width="38%"><strong>Service Type</strong></td>\n`;
              body += `      <td width="62%">${item.service_type}</td>\n`;
              body += `    </tr>\n`;
              body += `    <tr>\n`;
              body += `      <td width="38%"><strong>Next Due Date</strong></td>\n`;
              body += `      <td width="62%"><strong>${formatToDMY(item.next_due_date)}</strong></td>\n`;
              body += `    </tr>\n`;
              body += `    <tr>\n`;
              body += `      <td width="38%"><strong>Tenant Name</strong></td>\n`;
              body += `      <td width="62%">${item.tenant_name || 'N/A'}</td>\n`;
              body += `    </tr>\n`;
              body += `    <tr>\n`;
              body += `      <td width="38%"><strong>Last Service Done</strong></td>\n`;
              body += `      <td width="62%">${formatToDMY(item.last_service_date)}</td>\n`;
              body += `    </tr>\n`;
              body += `  </tbody>\n`;
              body += `</table>\n\n`;
              body += `---\n\n`;
            });

            body += `👉 **[Open Maintenance Console](https://ekodio.github.io/apartment-service-reminders/)**\n`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Maintenance Alert: ${dueItems.length} unit(s) due on ${targetDMY}`,
              body: body
            });
