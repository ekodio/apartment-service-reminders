name: Daily Maintenance Check & Alert

on:
  schedule:
    - cron: '30 3 * * *' # 09:00 AM IST daily
  workflow_dispatch:

jobs:
  check-and-alert:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check Due Dates & Dispatch Alert
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const fileContent = JSON.parse(fs.readFileSync('data.json', 'utf8'));
            const schedules = Array.isArray(fileContent) ? fileContent : (fileContent.schedules || []);

            const targetDate = new Date();
            targetDate.setDate(targetDate.getDate() + 7);
            const targetStr = targetDate.toISOString().split('T')[0];

            const formatToDMY = (dStr) => {
              if (!dStr) return 'N/A';
              const parts = dStr.split('-');
              return parts.length === 3 ? `${parts[2]}-${parts[1]}-${parts[0]}` : dStr;
            };

            const targetDMY = formatToDMY(targetStr);
            const dueItems = schedules.filter(item => item.next_due_date === targetStr);

            if (dueItems.length === 0) {
              console.log('No services due in 7 days.');
              return;
            }

            let rows = dueItems.map((item, idx) => `
              <tr>
                <td align="center">${idx + 1}</td>
                <td><strong>${item.building_name}</strong> — Unit ${item.unit_number}</td>
                <td>${item.service_type}</td>
                <td align="center"><strong>${formatToDMY(item.next_due_date)}</strong></td>
                <td>${item.tenant_name || 'N/A'}</td>
                <td align="center">${formatToDMY(item.last_service_date)}</td>
              </tr>
            `).join('');

            let body = `Attention: @${context.repo.owner}\n\n`;
            body += `### Maintenance Due in 7 Days (${targetDMY})\n\n`;
            body += `The following **${dueItems.length} unit(s)** require service:\n\n`;

            body += `<table width="100%" border="1" cellpadding="8" cellspacing="0">\n`;
            body += `  <thead>\n`;
            body += `    <tr bgcolor="#f8fafc">\n`;
            body += `      <th align="center">#</th>\n`;
            body += `      <th align="left">Property / Unit</th>\n`;
            body += `      <th align="left">Service</th>\n`;
            body += `      <th align="center">Next Due</th>\n`;
            body += `      <th align="left">Tenant</th>\n`;
            body += `      <th align="center">Last Done</th>\n`;
            body += `    </tr>\n`;
            body += `  </thead>\n`;
            body += `  <tbody>\n`;
            body += `    ${rows}\n`;
            body += `  </tbody>\n`;
            body += `</table>\n\n`;

            body += `👉 **[Open Maintenance Console](https://ekodio.github.io/apartment-service-reminders/)**\n`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Maintenance Alert: ${dueItems.length} unit(s) due on ${targetDMY}`,
              body: body
            });
