<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apartment Maintenance Console</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 p-6 md:p-10 text-slate-800 font-sans">
  <div class="max-w-7xl mx-auto space-y-6">
    <header class="border-b border-slate-200 pb-4 flex flex-col md:flex-row md:justify-between md:items-center gap-4">
      <div>
        <h1 class="text-2xl font-bold text-slate-900">Apartment Maintenance Console</h1>
        <p class="text-sm text-slate-500">Live Auto-Sync with GitHub & Automated Alerts</p>
      </div>
      <!-- Token Config Bar -->
      <div class="flex items-center gap-2 bg-white p-2 border rounded-lg shadow-sm">
        <input id="ghToken" type="password" placeholder="Paste GitHub Token" class="text-xs p-1.5 border rounded w-48 focus:outline-blue-500">
        <button onclick="saveToken()" class="text-xs bg-slate-900 hover:bg-slate-800 text-white px-3 py-1.5 rounded font-medium">
          Save Key
        </button>
      </div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <!-- Add Service Form -->
      <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm space-y-4">
        <h2 class="font-semibold text-lg text-slate-900">Add Service Schedule</h2>
        <form id="addServiceForm" class="space-y-3">
          <div>
            <label class="text-xs text-slate-600 font-semibold">Building Name</label>
            <input id="buildingName" type="text" placeholder="e.g. Sunset Heights" required class="w-full p-2 border rounded text-sm mt-1">
          </div>
          <div>
            <label class="text-xs text-slate-600 font-semibold">Flat / Unit Number</label>
            <input id="unitNumber" type="text" placeholder="e.g. Flat 302" required class="w-full p-2 border rounded text-sm mt-1">
          </div>
          <div>
            <label class="text-xs text-slate-600 font-semibold">Tenant Name</label>
            <input id="tenantName" type="text" placeholder="e.g. John Doe" required class="w-full p-2 border rounded text-sm mt-1">
          </div>

          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-xs text-slate-600 font-semibold">Service Type</label>
              <input id="serviceType" type="text" placeholder="e.g. AC Service" required class="w-full p-2 border rounded text-sm mt-1">
            </div>
            <div>
              <label class="text-xs text-slate-600 font-semibold">Cycle Interval</label>
              <select id="cycleDays" class="w-full p-2 border rounded text-sm mt-1">
                <option value="30">1 Month (30d)</option>
                <option value="90" selected>3 Months (90d)</option>
                <option value="180">6 Months (180d)</option>
                <option value="365">1 Year (365d)</option>
              </select>
            </div>
          </div>

          <div>
            <label class="text-xs text-slate-600 font-semibold">First Service Done On</label>
            <input id="firstDate" type="date" required class="w-full p-2 border rounded text-sm mt-1">
          </div>

          <div>
            <label class="text-xs text-slate-600 font-semibold">Last Service Done On</label>
            <input id="lastDate" type="date" required class="w-full p-2 border rounded text-sm mt-1">
          </div>

          <div>
            <label class="text-xs text-slate-600 font-semibold text-blue-600">Next Due Date</label>
            <input id="dueDate" type="date" required class="w-full p-2 border-2 border-blue-200 rounded text-sm mt-1 font-semibold">
          </div>

          <button id="submitBtn" type="submit" class="w-full bg-slate-900 text-white py-2 rounded text-sm font-medium hover:bg-slate-800 transition">
            Add Service Record
          </button>
        </form>
      </div>

      <!-- Tables -->
      <div class="lg:col-span-2 space-y-6">
        <!-- Active Schedules -->
        <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden p-4">
          <div class="flex justify-between items-center mb-3">
            <h2 class="font-semibold text-lg text-slate-900">Active Service Schedules</h2>
            <span id="syncStatus" class="text-xs font-medium text-emerald-600">● Live Saved to GitHub</span>
          </div>

          <div class="overflow-x-auto">
            <table class="w-full text-left text-sm">
              <thead>
                <tr class="border-b bg-slate-50 text-slate-600">
                  <th class="p-2">Property & Tenant</th>
                  <th class="p-2">Service</th>
                  <th class="p-2">Cycle</th>
                  <th class="p-2">Last Done</th>
                  <th class="p-2">Next Due</th>
                  <th class="p-2 text-right">Actions</th>
                </tr>
              </thead>
              <tbody id="servicesList"></tbody>
            </table>
          </div>
        </div>

        <!-- Completed Log -->
        <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden p-4">
          <div class="flex justify-between items-center mb-2">
            <h2 class="font-semibold text-md text-slate-900">📜 Completed Service Log</h2>
            <button onclick="clearHistory()" class="text-[11px] text-red-500 hover:underline">Clear History</button>
          </div>
          <div class="overflow-x-auto">
            <table class="w-full text-left text-xs text-slate-600">
              <thead>
                <tr class="border-b bg-slate-50">
                  <th class="p-2">Property & Tenant</th>
                  <th class="p-2">Service</th>
                  <th class="p-2">Date Completed</th>
                  <th class="p-2 text-right">Action</th>
                </tr>
              </thead>
              <tbody id="historyList"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const GITHUB_REPO = "ekodio/apartment-service-reminders";
    let state = {
      schedules: [],
      history: []
    };
    let fileSha = "";

    const lastDateInput = document.getElementById('lastDate');
    const cycleInput = document.getElementById('cycleDays');
    const dueDateInput = document.getElementById('dueDate');

    function updateCalculatedDueDate() {
      if (!lastDateInput.value) return;
      const base = new Date(lastDateInput.value);
      const days = parseInt(cycleInput.value, 10);
      base.setDate(base.getDate() + days);
      dueDateInput.value = base.toISOString().split('T')[0];
    }

    lastDateInput.addEventListener('change', updateCalculatedDueDate);
    cycleInput.addEventListener('change', updateCalculatedDueDate);

    function getToken() {
      return localStorage.getItem('gh_sync_token') || '';
    }

    function saveToken() {
      const val = document.getElementById('ghToken').value.trim();
      if (val) {
        localStorage.setItem('gh_sync_token', val);
        alert('GitHub Token saved!');
        loadData();
      }
    }

    async function loadData() {
      const token = getToken();
      if (token) {
        document.getElementById('ghToken').value = token;
      }

      try {
        const headers = token ? { Authorization: `token ${token}` } : {};
        const res = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/data.json`, { headers });
        const fileData = await res.json();
        
        fileSha = fileData.sha;
        const content = decodeURIComponent(escape(atob(fileData.content)));
        const parsed = JSON.parse(content);
        
        if (Array.isArray(parsed)) {
          state.schedules = parsed;
          state.history = JSON.parse(localStorage.getItem('apt_maintenance_history')) || [];
        } else {
          state.schedules = parsed.schedules || [];
          state.history = parsed.history || [];
        }

        renderTable();
        renderHistory();
      } catch (err) {
        console.error('Fetch error:', err);
      }
    }

    async function syncToGitHub() {
      const token = getToken();
      const statusEl = document.getElementById('syncStatus');

      localStorage.setItem('apt_maintenance_records', JSON.stringify(state.schedules));
      localStorage.setItem('apt_maintenance_history', JSON.stringify(state.history));

      renderTable();
      renderHistory();

      if (!token) {
        statusEl.textContent = "● Saved Locally (Add Token to sync Cloud)";
        statusEl.className = "text-xs font-medium text-amber-600";
        return;
      }

      statusEl.textContent = "⏳ Saving to GitHub...";
      statusEl.className = "text-xs font-medium text-amber-600";

      try {
        const payload = {
          schedules: state.schedules,
          history: state.history
        };

        const utf8Content = unescape(encodeURIComponent(JSON.stringify(payload, null, 2)));
        const base64Content = btoa(utf8Content);

        const res = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/data.json`, {
          method: 'PUT',
          headers: {
            Authorization: `token ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message: "Update maintenance schedules and completed log",
            content: base64Content,
            sha: fileSha
          })
        });

        const resData = await res.json();
        if (res.ok) {
          fileSha = resData.content.sha;
          statusEl.textContent = "● Live Saved to GitHub";
          statusEl.className = "text-xs font-medium text-emerald-600";
        } else {
          statusEl.textContent = "❌ Sync Error";
          statusEl.className = "text-xs font-medium text-red-600";
        }
      } catch (err) {
        statusEl.textContent = "❌ Network Error";
        statusEl.className = "text-xs font-medium text-red-600";
      }
    }

    function renderTable() {
      const tbody = document.getElementById('servicesList');
      if (!state.schedules.length) {
        tbody.innerHTML = '<tr><td colspan="6" class="p-4 text-center text-slate-400">No active schedules.</td></tr>';
        return;
      }

      tbody.innerHTML = state.schedules.map((item, index) => `
        <tr class="border-b hover:bg-slate-50">
          <td class="p-2">
            <span class="font-semibold text-slate-900">${item.building_name} — ${item.unit_number}</span>
            <span class="text-xs text-slate-500 block">👤 ${item.tenant_name || 'N/A'}</span>
          </td>
          <td class="p-2 font-medium text-slate-700">${item.service_type}</td>
          <td class="p-2 text-xs text-slate-500">${item.cycle_days || 90}d</td>
          <td class="p-2 font-mono text-xs text-slate-500">${item.last_service_date}</td>
          <td class="p-2 font-mono text-xs font-semibold text-blue-600">${item.next_due_date}</td>
          <td class="p-2 text-right space-x-1">
            <button onclick="markDone(${index})" class="bg-green-50 text-green-700 border border-green-200 text-xs px-2.5 py-1 rounded hover:bg-green-100 font-medium">
              ✓ Mark Done
            </button>
            <button onclick="deleteRecord(${index})" class="bg-red-50 text-red-600 border border-red-200 text-xs px-2 py-1 rounded hover:bg-red-100 font-medium">
              🗑️
            </button>
          </td>
        </tr>
      `).join('');
    }

    function renderHistory() {
      const hbody = document.getElementById('historyList');
      if (!state.history || !state.history.length) {
        hbody.innerHTML = '<tr><td colspan="4" class="p-3 text-center text-slate-400">No completed services logged yet.</td></tr>';
        return;
      }

      hbody.innerHTML = [...state.history].reverse().map((log, index) => `
        <tr class="border-b hover:bg-slate-50">
          <td class="p-2">
            <span class="font-semibold text-slate-800">${log.building_name} — ${log.unit_number}</span>
            <span class="text-xs text-slate-400 block">${log.tenant_name || ''}</span>
          </td>
          <td class="p-2 font-medium text-slate-700">${log.service_type}</td>
          <td class="p-2 font-mono text-emerald-700 font-semibold">${log.completed_date}</td>
          <td class="p-2 text-right">
            <button onclick="reopenService(${state.history.length - 1 - index})" class="text-xs bg-slate-100 text-slate-600 hover:bg-slate-200 px-2 py-1 rounded border">
              ↩ Re-activate
            </button>
          </td>
        </tr>
      `).join('');
    }

    // Add Service Form
    document.getElementById('addServiceForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const newRecord = {
        id: Date.now().toString(),
        building_name: document.getElementById('buildingName').value,
        unit_number: document.getElementById('unitNumber').value,
        tenant_name: document.getElementById('tenantName').value,
        service_type: document.getElementById('serviceType').value,
        cycle_days: parseInt(document.getElementById('cycleDays').value, 10),
        first_service_date: document.getElementById('firstDate').value,
        last_service_date: document.getElementById('lastDate').value,
        next_due_date: document.getElementById('dueDate').value,
        status: 'Upcoming'
      };

      state.schedules.push(newRecord);
      await syncToGitHub();
      document.getElementById('addServiceForm').reset();
    });

    // Mark Done: Moves item from active list to completed log
    window.markDone = async function(index) {
      const item = state.schedules[index];
      const today = new Date().toISOString().split('T')[0];

      // Add to completed log
      state.history.push({
        id: item.id || Date.now().toString(),
        building_name: item.building_name,
        unit_number: item.unit_number,
        tenant_name: item.tenant_name,
        service_type: item.service_type,
        cycle_days: item.cycle_days || 90,
        completed_date: today,
        timestamp: new Date().toISOString()
      });

      // Remove from active schedules
      state.schedules.splice(index, 1);

      await syncToGitHub();
    };

    // Re-activate a completed item if you need to schedule it again
    window.reopenService = async function(historyIndex) {
      const item = state.history[historyIndex];
      const today = new Date();
      const cycle = item.cycle_days || 90;
      
      const nextDue = new Date(today);
      nextDue.setDate(nextDue.getDate() + cycle);

      state.schedules.push({
        id: Date.now().toString(),
        building_name: item.building_name,
        unit_number: item.unit_number,
        tenant_name: item.tenant_name,
        service_type: item.service_type,
        cycle_days: cycle,
        first_service_date: item.completed_date,
        last_service_date: item.completed_date,
        next_due_date: nextDue.toISOString().split('T')[0],
        status: 'Upcoming'
      });

      state.history.splice(historyIndex, 1);
      await syncToGitHub();
    };

    // Delete Record
    window.deleteRecord = async function(index) {
      if (confirm(`Delete schedule for ${state.schedules[index].unit_number}?`)) {
        state.schedules.splice(index, 1);
        await syncToGitHub();
      }
    };

    // Clear History Log
    window.clearHistory = async function() {
      if (confirm('Clear all completed service records?')) {
        state.history = [];
        await syncToGitHub();
      }
    };

    loadData();
  </script>
</body>
</html>
