<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apartment Maintenance Console</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 p-4 sm:p-6 md:p-10 text-slate-800 font-sans min-h-screen">
  <div class="max-w-6xl mx-auto space-y-6">
    
    <!-- Header -->
    <header class="bg-white p-4 sm:p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col md:flex-row md:justify-between md:items-center gap-4">
      <div>
        <h1 class="text-xl sm:text-2xl font-bold text-slate-900 tracking-tight">Apartment Maintenance</h1>
        <p class="text-xs sm:text-sm text-slate-500 mt-0.5">Automated schedules, alerts & completion notifications</p>
      </div>
      <div class="flex items-center gap-2">
        <input id="ghToken" type="password" placeholder="GitHub Access Token" class="text-xs p-2 border border-slate-300 rounded-lg w-full sm:w-56 focus:ring-2 focus:ring-slate-900 focus:outline-none">
        <button onclick="saveToken()" class="text-xs bg-slate-900 hover:bg-slate-800 text-white px-3.5 py-2 rounded-lg font-medium whitespace-nowrap transition">
          Save Key
        </button>
      </div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 items-start">
      
      <!-- Left: Add Form -->
      <div class="bg-white p-5 sm:p-6 rounded-2xl border border-slate-200 shadow-sm">
        <h2 class="font-semibold text-base text-slate-900 mb-4">Add Schedule</h2>
        <form id="addServiceForm" class="space-y-3.5">
          <div>
            <label class="text-xs font-medium text-slate-600">Building Name</label>
            <input id="buildingName" type="text" placeholder="e.g. Sunset Heights" required class="w-full p-2.5 border border-slate-300 rounded-lg text-sm mt-1 focus:ring-2 focus:ring-slate-900 focus:outline-none">
          </div>
          <div>
            <label class="text-xs font-medium text-slate-600">Flat / Unit Number</label>
            <input id="unitNumber" type="text" placeholder="e.g. 302" required class="w-full p-2.5 border border-slate-300 rounded-lg text-sm mt-1 focus:ring-2 focus:ring-slate-900 focus:outline-none">
          </div>
          <div>
            <label class="text-xs font-medium text-slate-600">Tenant Name</label>
            <input id="tenantName" type="text" placeholder="e.g. John Doe" required class="w-full p-2.5 border border-slate-300 rounded-lg text-sm mt-1 focus:ring-2 focus:ring-slate-900 focus:outline-none">
          </div>

          <div class="grid grid-cols-2 gap-2.5">
            <div>
              <label class="text-xs font-medium text-slate-600">Service Type</label>
              <input id="serviceType" type="text" placeholder="e.g. AC Service" required class="w-full p-2.5 border border-slate-300 rounded-lg text-sm mt-1 focus:ring-2 focus:ring-slate-900 focus:outline-none">
            </div>
            <div>
              <label class="text-xs font-medium text-slate-600">Cycle</label>
              <select id="cycleDays" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm mt-1 bg-white focus:ring-2 focus:ring-slate-900 focus:outline-none">
                <option value="30">1 Month</option>
                <option value="90" selected>3 Months</option>
                <option value="180">6 Months</option>
                <option value="365">1 Year</option>
              </select>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-2.5">
            <div>
              <label class="text-xs font-medium text-slate-600">First Done</label>
              <input id="firstDate" type="date" required class="w-full p-2 border border-slate-300 rounded-lg text-xs mt-1">
            </div>
            <div>
              <label class="text-xs font-medium text-slate-600">Last Done</label>
              <input id="lastDate" type="date" required class="w-full p-2 border border-slate-300 rounded-lg text-xs mt-1">
            </div>
          </div>

          <div>
            <label class="text-xs font-semibold text-blue-600">Next Due Date</label>
            <input id="dueDate" type="date" required class="w-full p-2.5 border-2 border-blue-200 rounded-lg text-sm font-semibold text-blue-900 mt-1">
          </div>

          <button id="submitBtn" type="submit" class="w-full bg-slate-900 text-white py-2.5 rounded-lg text-sm font-semibold hover:bg-slate-800 transition">
            Add Service Record
          </button>
        </form>
      </div>

      <!-- Right: Active Schedules & Completed Log -->
      <div class="lg:col-span-2 space-y-6">
        
        <!-- Active Schedules -->
        <div class="bg-white p-5 sm:p-6 rounded-2xl border border-slate-200 shadow-sm">
          <div class="flex justify-between items-center mb-4">
            <h2 class="font-semibold text-base text-slate-900">Active Service Schedules</h2>
            <span id="syncStatus" class="text-xs font-medium text-emerald-600">● Connected</span>
          </div>

          <!-- Desktop Table -->
          <div class="hidden md:block overflow-x-auto">
            <table class="w-full text-left text-sm">
              <thead>
                <tr class="border-b border-slate-200 text-slate-500 text-xs font-medium">
                  <th class="pb-2">Property & Tenant</th>
                  <th class="pb-2">Service</th>
                  <th class="pb-2">Cycle</th>
                  <th class="pb-2">Next Due</th>
                  <th class="pb-2 text-right">Action</th>
                </tr>
              </thead>
              <tbody id="servicesListDesktop" class="divide-y divide-slate-100"></tbody>
            </table>
          </div>

          <!-- Mobile Cards -->
          <div id="servicesListMobile" class="md:hidden space-y-3"></div>
        </div>

        <!-- Completed Log -->
        <div class="bg-white p-5 sm:p-6 rounded-2xl border border-slate-200 shadow-sm">
          <div class="flex justify-between items-center mb-4">
            <h2 class="font-semibold text-base text-slate-900">Completed Service Log</h2>
            <button onclick="clearHistory()" class="text-xs text-slate-400 hover:text-red-500">Clear</button>
          </div>

          <!-- Desktop Table -->
          <div class="hidden md:block overflow-x-auto">
            <table class="w-full text-left text-xs text-slate-600">
              <thead>
                <tr class="border-b border-slate-200 text-slate-500 font-medium">
                  <th class="pb-2">Property</th>
                  <th class="pb-2">Service</th>
                  <th class="pb-2">Completed Date</th>
                  <th class="pb-2 text-right">Action</th>
                </tr>
              </thead>
              <tbody id="historyListDesktop" class="divide-y divide-slate-100"></tbody>
            </table>
          </div>

          <!-- Mobile Cards -->
          <div id="historyListMobile" class="md:hidden space-y-2.5"></div>
        </div>

      </div>
    </div>
  </div>

  <script>
    const GITHUB_REPO = "ekodio/apartment-service-reminders";
    let state = { schedules: [], history: [] };
    let fileSha = "";

    const lastDateInput = document.getElementById('lastDate');
    const cycleInput = document.getElementById('cycleDays');
    const dueDateInput = document.getElementById('dueDate');

    function formatToDMY(dStr) {
      if (!dStr) return 'N/A';
      const parts = dStr.split('-');
      return parts.length === 3 ? `${parts[2]}-${parts[1]}-${parts[0]}` : dStr;
    }

    function updateCalculatedDueDate() {
      if (!lastDateInput.value) return;
      const base = new Date(lastDateInput.value);
      const days = parseInt(cycleInput.value, 10);
      base.setDate(base.getDate() + days);
      dueDateInput.value = base.toISOString().split('T')[0];
    }

    lastDateInput.addEventListener('change', updateCalculatedDueDate);
    cycleInput.addEventListener('change', updateCalculatedDueDate);

    function getToken() { return localStorage.getItem('gh_sync_token') || ''; }

    function saveToken() {
      const val = document.getElementById('ghToken').value.trim();
      if (val) {
        localStorage.setItem('gh_sync_token', val);
        alert('Key saved!');
        loadData();
      }
    }

    async function loadData() {
      const token = getToken();
      if (token) document.getElementById('ghToken').value = token;

      try {
        const headers = token ? { Authorization: `token ${token}` } : {};
        const res = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/data.json`, { headers });
        const fileData = await res.json();
        
        fileSha = fileData.sha;
        const content = decodeURIComponent(escape(atob(fileData.content)));
        const parsed = JSON.parse(content);
        
        state.schedules = parsed.schedules || (Array.isArray(parsed) ? parsed : []);
        state.history = parsed.history || JSON.parse(localStorage.getItem('apt_maintenance_history')) || [];

        renderAll();
      } catch (err) {
        console.error('Fetch error:', err);
      }
    }

    async function syncToGitHub() {
      const token = getToken();
      const statusEl = document.getElementById('syncStatus');

      renderAll();

      if (!token) {
        statusEl.textContent = "● Saved Locally (Missing Token)";
        statusEl.className = "text-xs font-medium text-amber-600";
        return;
      }

      statusEl.textContent = "⏳ Saving...";
      statusEl.className = "text-xs font-medium text-amber-600";

      try {
        const payload = { schedules: state.schedules, history: state.history };
        const utf8Content = unescape(encodeURIComponent(JSON.stringify(payload, null, 2)));
        const base64Content = btoa(utf8Content);

        const res = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/data.json`, {
          method: 'PUT',
          headers: { Authorization: `token ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: "Update schedules",
            content: base64Content,
            sha: fileSha
          })
        });

        const resData = await res.json();
        if (res.ok) {
          fileSha = resData.content.sha;
          statusEl.textContent = "● Saved";
          statusEl.className = "text-xs font-medium text-emerald-600";
        }
      } catch (err) {
        statusEl.textContent = "❌ Sync Error";
        statusEl.className = "text-xs font-medium text-red-600";
      }
    }

    // Sends the completion email alert through GitHub Issues
    async function sendCompletionNotification(item, completedDate) {
      const token = getToken();
      if (!token) return;

      const completedDMY = formatToDMY(completedDate);
      const nextDue = new Date(completedDate);
      nextDue.setDate(nextDue.getDate() + (item.cycle_days || 90));
      const nextDueDMY = formatToDMY(nextDue.toISOString().split('T')[0]);

      let body = `Attention: @ekodio\n\n`;
      body += `## Service Completed Successfully\n\n`;
      body += `<table width="100%" border="1" cellpadding="10" cellspacing="0">\n`;
      body += `  <tbody>\n`;
      body += `    <tr>\n`;
      body += `      <td width="38%"><strong>Property / Flat</strong></td>\n`;
      body += `      <td width="62%">${item.building_name} — Unit ${item.unit_number}</td>\n`;
      body += `    </tr>\n`;
      body += `    <tr>\n`;
      body += `      <td width="38%"><strong>Service Done</strong></td>\n`;
      body += `      <td width="62%">${item.service_type}</td>\n`;
      body += `    </tr>\n`;
      body += `    <tr>\n`;
      body += `      <td width="38%"><strong>Tenant</strong></td>\n`;
      body += `      <td width="62%">${item.tenant_name || 'N/A'}</td>\n`;
      body += `    </tr>\n`;
      body += `    <tr>\n`;
      body += `      <td width="38%"><strong>Completed Date</strong></td>\n`;
      body += `      <td width="62%"><strong>${completedDMY}</strong></td>\n`;
      body += `    </tr>\n`;
      body += `    <tr>\n`;
      body += `      <td width="38%"><strong>Next Scheduled Due</strong></td>\n`;
      body += `      <td width="62%">${nextDueDMY} (${item.cycle_days || 90} days cycle)</td>\n`;
      body += `    </tr>\n`;
      body += `  </tbody>\n`;
      body += `</table>\n\n`;
      body += `👉 **[Open Maintenance Console](https://ekodio.github.io/apartment-service-reminders/)**\n`;

      try {
        const issueRes = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/issues`, {
          method: 'POST',
          headers: { Authorization: `token ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({
            title: `Service Completed: ${item.service_type} — ${item.building_name} ${item.unit_number}`,
            body: body
          })
        });
        const issueData = await issueRes.json();

        // Immediately close the issue so it acts as an archive and triggers email without staying open
        if (issueData.number) {
          await fetch(`https://api.github.com/repos/${GITHUB_REPO}/issues/${issueData.number}`, {
            method: 'PATCH',
            headers: { Authorization: `token ${token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ state: 'closed' })
          });
        }
      } catch (err) {
        console.error('Notification dispatch error:', err);
      }
    }

    function renderAll() {
      renderDesktopTable();
      renderMobileCards();
      renderDesktopHistory();
      renderMobileHistory();
    }

    function renderDesktopTable() {
      const el = document.getElementById('servicesListDesktop');
      if (!state.schedules.length) {
        el.innerHTML = '<tr><td colspan="5" class="py-6 text-center text-slate-400 text-xs">No active schedules.</td></tr>';
        return;
      }
      el.innerHTML = state.schedules.map((item, index) => `
        <tr class="hover:bg-slate-50">
          <td class="py-3">
            <div class="font-semibold text-slate-900">${item.building_name} — ${item.unit_number}</div>
            <div class="text-xs text-slate-400">${item.tenant_name || ''}</div>
          </td>
          <td class="py-3 text-slate-700">${item.service_type}</td>
          <td class="py-3 text-xs text-slate-400">${item.cycle_days || 90}d</td>
          <td class="py-3 font-semibold text-blue-600">${formatToDMY(item.next_due_date)}</td>
          <td class="py-3 text-right space-x-1">
            <button onclick="markDone(${index})" class="bg-emerald-50 text-emerald-700 border border-emerald-200 text-xs px-2.5 py-1 rounded-md font-medium hover:bg-emerald-100">
              ✓ Done
            </button>
            <button onclick="deleteRecord(${index})" class="text-slate-400 hover:text-red-500 text-xs px-2 py-1">
              ✕
            </button>
          </td>
        </tr>
      `).join('');
    }

    function renderMobileCards() {
      const el = document.getElementById('servicesListMobile');
      if (!state.schedules.length) {
        el.innerHTML = '<div class="text-center py-6 text-slate-400 text-xs">No active schedules.</div>';
        return;
      }
      el.innerHTML = state.schedules.map((item, index) => `
        <div class="p-3.5 bg-slate-50 rounded-xl border border-slate-200 flex justify-between items-center gap-3">
          <div>
            <div class="font-bold text-sm text-slate-900">${item.building_name} — ${item.unit_number}</div>
            <div class="text-xs text-slate-500 mt-0.5">${item.service_type} • ${item.tenant_name || 'N/A'}</div>
            <div class="text-xs font-semibold text-blue-600 mt-1">Due: ${formatToDMY(item.next_due_date)}</div>
          </div>
          <div class="flex flex-col gap-1.5 items-end">
            <button onclick="markDone(${index})" class="bg-emerald-600 text-white text-xs px-3 py-1.5 rounded-lg font-medium shadow-sm">
              ✓ Done
            </button>
            <button onclick="deleteRecord(${index})" class="text-[11px] text-slate-400 hover:text-red-500">
              Remove
            </button>
          </div>
        </div>
      `).join('');
    }

    function renderDesktopHistory() {
      const el = document.getElementById('historyListDesktop');
      if (!state.history.length) {
        el.innerHTML = '<tr><td colspan="4" class="py-4 text-center text-slate-400 text-xs">No history logged yet.</td></tr>';
        return;
      }
      el.innerHTML = [...state.history].reverse().map((log, index) => `
        <tr class="hover:bg-slate-50">
          <td class="py-2.5 font-medium text-slate-800">${log.building_name} — ${log.unit_number}</td>
          <td class="py-2.5 text-slate-600">${log.service_type}</td>
          <td class="py-2.5 font-semibold text-emerald-700">${formatToDMY(log.completed_date)}</td>
          <td class="py-2.5 text-right">
            <button onclick="reopenService(${state.history.length - 1 - index})" class="text-xs text-slate-500 hover:text-slate-800 border px-2 py-0.5 rounded">
              ↩ Restore
            </button>
          </td>
        </tr>
      `).join('');
    }

    function renderMobileHistory() {
      const el = document.getElementById('historyListMobile');
      if (!state.history.length) {
        el.innerHTML = '<div class="text-center py-4 text-slate-400 text-xs">No history logged yet.</div>';
        return;
      }
      el.innerHTML = [...state.history].reverse().slice(0, 5).map((log, index) => `
        <div class="p-2.5 bg-slate-50 rounded-lg border border-slate-200 flex justify-between items-center text-xs">
          <div>
            <span class="font-semibold text-slate-900">${log.building_name} - ${log.unit_number}</span>
            <span class="text-slate-500 block">${log.service_type} • ${formatToDMY(log.completed_date)}</span>
          </div>
          <button onclick="reopenService(${state.history.length - 1 - index})" class="text-slate-600 text-[11px] border bg-white px-2 py-1 rounded">
            Restore
          </button>
        </div>
      `).join('');
    }

    document.getElementById('addServiceForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      state.schedules.push({
        id: Date.now().toString(),
        building_name: document.getElementById('buildingName').value,
        unit_number: document.getElementById('unitNumber').value,
        tenant_name: document.getElementById('tenantName').value,
        service_type: document.getElementById('serviceType').value,
        cycle_days: parseInt(document.getElementById('cycleDays').value, 10),
        first_service_date: document.getElementById('firstDate').value,
        last_service_date: document.getElementById('lastDate').value,
        next_due_date: document.getElementById('dueDate').value
      });
      await syncToGitHub();
      document.getElementById('addServiceForm').reset();
    });

    window.markDone = async function(index) {
      const item = state.schedules[index];
      const today = new Date().toISOString().split('T')[0];

      // Save to completed history
      state.history.push({
        ...item,
        completed_date: today
      });

      // Remove from active list
      state.schedules.splice(index, 1);

      // Save to data.json
      await syncToGitHub();

      // Trigger the completion email
      await sendCompletionNotification(item, today);
    };

    window.reopenService = async function(historyIndex) {
      const item = state.history[historyIndex];
      const nextDue = new Date();
      nextDue.setDate(nextDue.getDate() + (item.cycle_days || 90));
      state.schedules.push({
        ...item,
        first_service_date: item.completed_date,
        last_service_date: item.completed_date,
        next_due_date: nextDue.toISOString().split('T')[0]
      });
      state.history.splice(historyIndex, 1);
      await syncToGitHub();
    };

    window.deleteRecord = async function(index) {
      if (confirm('Remove this schedule?')) {
        state.schedules.splice(index, 1);
        await syncToGitHub();
      }
    };

    window.clearHistory = async function() {
      if (confirm('Clear completed logs?')) {
        state.history = [];
        await syncToGitHub();
      }
    };

    loadData();
  </script>
</body>
</html>
