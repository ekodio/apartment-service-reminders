<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apartment Maintenance Console</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 p-6 md:p-10 text-slate-800 font-sans">
  <div class="max-w-7xl mx-auto space-y-6">
    <header class="border-b border-slate-200 pb-4">
      <h1 class="text-2xl font-bold text-slate-900">Apartment Maintenance Console</h1>
      <p class="text-sm text-slate-500">Manage custom due dates and intervals for each service type</p>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <!-- Add Service Form -->
      <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm space-y-4">
        <h2 class="font-semibold text-lg text-slate-900">Add Service Schedule</h2>
        <form id="addServiceForm" class="space-y-3">
          <div>
            <label class="text-xs text-slate-600 font-semibold">Building Name</label>
            <input id="buildingName" type="text" placeholder="e.g. Tower A" required class="w-full p-2 border rounded text-sm mt-1">
          </div>
          <div>
            <label class="text-xs text-slate-600 font-semibold">Flat / Unit Number</label>
            <input id="unitNumber" type="text" placeholder="e.g. Flat 302" required class="w-full p-2 border rounded text-sm mt-1">
          </div>
          <div>
            <label class="text-xs text-slate-600 font-semibold">Tenant Name</label>
            <input id="tenantName" type="text" placeholder="e.g. John Doe" required class="w-full p-2 border rounded text-sm mt-1">
          </div>

          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-xs text-slate-600 font-semibold">Service Type</label>
              <input id="serviceType" type="text" placeholder="e.g. AC Service" required class="w-full p-2 border rounded text-sm mt-1">
            </div>
            <div>
              <label class="text-xs text-slate-600 font-semibold">Cycle Interval</label>
              <select id="cycleDays" class="w-full p-2 border rounded text-sm mt-1">
                <option value="30">1 Month (30d)</option>
                <option value="90" selected>3 Months (90d)</option>
                <option value="180">6 Months (180d)</option>
                <option value="365">1 Year (365d)</option>
              </select>
            </div>
          </div>

          <div>
            <label class="text-xs text-slate-600 font-semibold">First Service Done On</label>
            <input id="firstDate" type="date" required class="w-full p-2 border rounded text-sm mt-1">
          </div>

          <div>
            <label class="text-xs text-slate-600 font-semibold">Last Service Done On</label>
            <input id="lastDate" type="date" required class="w-full p-2 border rounded text-sm mt-1">
          </div>

          <div>
            <label class="text-xs text-slate-600 font-semibold text-blue-600">Next Due Date (Manual or Auto)</label>
            <input id="dueDate" type="date" required class="w-full p-2 border-2 border-blue-200 rounded text-sm mt-1 font-semibold">
          </div>

          <button type="submit" class="w-full bg-slate-900 text-white py-2 rounded text-sm font-medium hover:bg-slate-800 transition">
            Add Service Record
          </button>
        </form>
      </div>

      <!-- Schedules Table -->
      <div class="lg:col-span-2 bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden p-4">
        <div class="flex justify-between items-center mb-3">
          <h2 class="font-semibold text-lg">Maintenance Schedules</h2>
          <button id="downloadBtn" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium px-3 py-1.5 rounded border">
            📥 Save / Download data.json
          </button>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm">
            <thead>
              <tr class="border-b bg-slate-50 text-slate-600">
                <th class="p-2">Property & Tenant</th>
                <th class="p-2">Service</th>
                <th class="p-2">Cycle</th>
                <th class="p-2">Last Done</th>
                <th class="p-2">Next Due</th>
                <th class="p-2">Action</th>
              </tr>
            </thead>
            <tbody id="servicesList">
              <!-- Rendered via JS -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    let serviceRecords = [];

    // Auto-calculate Due Date when Last Service Date or Cycle changes
    const lastDateInput = document.getElementById('lastDate');
    const cycleInput = document.getElementById('cycleDays');
    const dueDateInput = document.getElementById('dueDate');

    function updateCalculatedDueDate() {
      if (!lastDateInput.value) return;
      const base = new Date(lastDateInput.value);
      const days = parseInt(cycleInput.value, 10);
      base.setDate(base.getDate() + days);
      dueDateInput.value = base.toISOString().split('T')[0];
    }

    lastDateInput.addEventListener('change', updateCalculatedDueDate);
    cycleInput.addEventListener('change', updateCalculatedDueDate);

    // Load data from repository
    async function loadData() {
      try {
        const response = await fetch('./data.json');
        serviceRecords = await response.json();
        renderTable();
      } catch (err) {
        console.error('Could not load data.json', err);
      }
    }

    function renderTable() {
      const tbody = document.getElementById('servicesList');
      if (!serviceRecords.length) {
        tbody.innerHTML = '<tr><td colspan="6" class="p-4 text-center text-slate-400">No schedules recorded yet.</td></tr>';
        return;
      }

      tbody.innerHTML = serviceRecords.map((item, index) => `
        <tr class="border-b hover:bg-slate-50">
          <td class="p-2">
            <span class="font-semibold text-slate-900">${item.building_name} — ${item.unit_number}</span>
            <span class="text-xs text-slate-500 block">👤 ${item.tenant_name || 'N/A'}</span>
          </td>
          <td class="p-2 font-medium text-slate-700">${item.service_type}</td>
          <td class="p-2 text-xs text-slate-500">${item.cycle_days || 90}d</td>
          <td class="p-2 font-mono text-xs text-slate-500">${item.last_service_date}</td>
          <td class="p-2 font-mono text-xs font-semibold text-blue-600">${item.next_due_date}</td>
          <td class="p-2">
            <button onclick="markDone(${index})" class="bg-blue-50 text-blue-600 border border-blue-200 text-xs px-2.5 py-1 rounded hover:bg-blue-100 font-medium">
              Mark Done
            </button>
          </td>
        </tr>
      `).join('');
    }

    // Add Service Entry
    document.getElementById('addServiceForm').addEventListener('submit', (e) => {
      e.preventDefault();

      serviceRecords.push({
        id: Date.now().toString(),
        building_name: document.getElementById('buildingName').value,
        unit_number: document.getElementById('unitNumber').value,
        tenant_name: document.getElementById('tenantName').value,
        service_type: document.getElementById('serviceType').value,
        cycle_days: parseInt(document.getElementById('cycleDays').value, 10),
        first_service_date: document.getElementById('firstDate').value,
        last_service_date: document.getElementById('lastDate').value,
        next_due_date: document.getElementById('dueDate').value,
        status: 'Upcoming'
      });

      renderTable();
      document.getElementById('addServiceForm').reset();
      alert('Service added! Download data.json and commit it to GitHub to save.');
    });

    // Advance service by its specific cycle interval
    window.markDone = function(index) {
      const item = serviceRecords[index];
      const completedDate = item.next_due_date;
      const cycle = item.cycle_days || 90;

      const nextDate = new Date(completedDate);
      nextDate.setDate(nextDate.getDate() + cycle);

      item.last_service_date = completedDate;
      item.next_due_date = nextDate.toISOString().split('T')[0];
      item.status = 'Upcoming';

      renderTable();
      alert(`Updated! Last service set to ${completedDate}, next due is ${item.next_due_date}. Save data.json.`);
    };

    // Download updated JSON
    document.getElementById('downloadBtn').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify(serviceRecords, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'data.json';
      a.click();
    });

    loadData();
  </script>
</body>
</html>
